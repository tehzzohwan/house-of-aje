spring:
  application:
    name: hoa-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/hoa}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: hoa-notifications
      auto-offset-reset: earliest

server:
  port: ${PORT:6040}

hoa:
  business-zone: ${HOA_BUSINESS_ZONE:Africa/Lagos}
  payment-window: ${HOA_PAYMENT_WINDOW:PT3M}
  reconciliation-interval: ${HOA_RECONCILIATION_INTERVAL:PT1M}
  reminder-interval: ${HOA_REMINDER_INTERVAL:PT1H}
  attendance-clockout-interval: ${HOA_ATTENDANCE_CLOCKOUT_INTERVAL:PT5M}
  security:
    jwt-secret: ${HOA_JWT_SECRET:dev-only-secret-change-me-before-production-0123456789}
    jwt-ttl: ${HOA_JWT_TTL:PT8H}
    admin-username: ${HOA_ADMIN_USERNAME:admin}
    admin-password: ${HOA_ADMIN_PASSWORD:admin}
    # HttpOnly session cookie. Secure must stay false over plain HTTP (local dev)
    # and be set true in production behind HTTPS.
    cookie-secure: ${HOA_COOKIE_SECURE:false}
  notifications:
    delivery: ${HOA_NOTIFICATION_DELIVERY:direct}
    topic: ${HOA_NOTIFICATION_TOPIC:hoa.notifications}
  payment:
    provider: ${HOA_PAYMENT_PROVIDER:stub}
  paystack:
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    secret-key: ${PAYSTACK_SECRET_KEY:sk_test_ce70a5e5ffd34ef5dbabdf5e74556e43bc10c786}
    preferred-bank: ${PAYSTACK_PREFERRED_BANK:wema-bank}

resilience4j:
  circuitbreaker:
    instances:
      paystack:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      paystack:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
